apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-pod-resources
spec:
  rules:
  - name: default-resources
    match:
      any:
      - resources:
          kinds:
          - Pod
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - (name): "*"
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"