apiVersion: policies.kyverno.io/v1
kind: NamespacedDeletingPolicy
metadata:
  name: cleanup-stale-configmaps
  namespace: production
spec:
  schedule: "*/2 * * * *"

  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["configmaps"]

  conditions:
  - name: stale-configmaps
    expression: >
      object.metadata.labels.exists(l,
      l == 'cleanup=true')
