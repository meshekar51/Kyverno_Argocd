apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        nginx: 'chandra'
    spec:
      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: cosign-image
        image: chandrag1990/flask-app@sha256:e243854df8c69808741358553f4f3195d6e7ac028dcc13a07b15cecd83008e11
        imagePullPolicy: Always
        ports:
        - containerPort: 80
