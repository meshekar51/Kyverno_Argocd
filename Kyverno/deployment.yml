apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        nginx: 'chandra'
    spec:
      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: cosign-image
        image: chandrag1990/flask-app:23
        imagePullPolicy: Always
        ports:
        - containerPort: 80
